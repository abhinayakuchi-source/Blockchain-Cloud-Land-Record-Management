<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Land Record</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Blockchain Cloud Land Record Management</h1>

        <h2>Add Land Record</h2>


        <!-- ======================================
             LAND RECORD FORM
        ======================================= -->

        <form id="landForm">


            <!-- OWNER NAME -->

            <div class="form-group">

                <label for="ownerName">
                    Owner Name
                </label>

                <input
                    type="text"
                    id="ownerName"
                    placeholder="Enter owner name"
                    required
                >

            </div>


            <!-- OWNER ID -->

            <div class="form-group">

                <label for="ownerId">
                    Owner ID
                </label>

                <input
                    type="text"
                    id="ownerId"
                    placeholder="Enter owner ID"
                    required
                >

            </div>


            <!-- SURVEY NUMBER -->

            <div class="form-group">

                <label for="surveyNumber">
                    Survey Number
                </label>

                <input
                    type="text"
                    id="surveyNumber"
                    placeholder="Enter survey number"
                    required
                >

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter land location"
                    required
                >

            </div>


            <!-- LAND AREA -->

            <div class="form-group">

                <label for="landArea">
                    Land Area
                </label>

                <input
                    type="number"
                    id="landArea"
                    placeholder="Enter land area"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- LAND TYPE -->

            <div class="form-group">

                <label for="landType">
                    Land Type
                </label>

                <select
                    id="landType"
                    required
                >

                    <option value="">
                        Select Land Type
                    </option>

                    <option value="Residential">
                        Residential
                    </option>

                    <option value="Agricultural">
                        Agricultural
                    </option>

                    <option value="Commercial">
                        Commercial
                    </option>

                    <option value="Industrial">
                        Industrial
                    </option>

                </select>

            </div>


            <!-- DOCUMENT NUMBER -->

            <div class="form-group">

                <label for="documentNumber">
                    Document Number
                </label>

                <input
                    type="text"
                    id="documentNumber"
                    placeholder="Enter document number"
                    required
                >

            </div>


            <!-- REGISTRATION DATE -->

            <div class="form-group">

                <label for="registrationDate">
                    Registration Date
                </label>

                <input
                    type="date"
                    id="registrationDate"
                    required
                >

            </div>


            <!-- OWNERSHIP STATUS -->

            <div class="form-group">

                <label for="ownershipStatus">
                    Ownership Status
                </label>

                <select id="ownershipStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Transferred">
                        Transferred
                    </option>

                </select>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
            >
                Add Land Record
            </button>


        </form>


        <!-- ======================================
             MESSAGE
        ======================================= -->

        <p id="message"></p>


        <!-- ======================================
             BACK BUTTON
        ======================================= -->

        <br>

        <a href="pages/dashboard.html">
            ← Back to Dashboard
        </a>

    </div>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="js/land.js"></script>
</body>

</html>
