<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transfer Land Ownership</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .details {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            display: none;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <h1>🔄 Transfer Land Ownership</h1>


        <!-- LAND RECORD -->

        <label>
            Select Land Record
        </label>

        <select id="landRecord">

            <option value="">
                -- Select Land Record --
            </option>

        </select>


        <!-- CURRENT OWNER -->

        <div id="currentOwner"
             class="details">

        </div>


        <!-- NEW OWNER -->

        <label>
            New Owner Name
        </label>

        <input
            type="text"
            id="newOwnerName"
            placeholder="Enter new owner name"
        >


        <label>
            New Owner ID
        </label>

        <input
            type="text"
            id="newOwnerId"
            placeholder="Enter new owner ID"
        >


        <!-- BUTTON -->

        <button
            onclick="transferOwnership()">

            Transfer Ownership

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>

    </div>

</div>



<script>


const API_URL =
    "http://localhost:5000/api/land-records";


// ==========================================
// LOAD LAND RECORDS
// ==========================================

async function loadLandRecords() {

    try {

        const response =
            await fetch(API_URL);


        const result =
            await response.json();


        const select =
            document.getElementById(
                "landRecord"
            );


        select.innerHTML = `
            <option value="">
                -- Select Land Record --
            </option>
        `;


        if (
            !result.success ||
            !result.data
        ) {

            return;

        }


        result.data.forEach(record => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                record._id;


            option.textContent =
                `${record.surveyNumber} - ${record.ownerName} - ${record.location}`;


            option.dataset.owner =
                record.ownerName;


            option.dataset.ownerId =
                record.ownerId;


            select.appendChild(option);

        });

    } catch (error) {

        showMessage(
            "Unable to connect to server",
            false
        );

    }

}



// ==========================================
// SHOW CURRENT OWNER
// ==========================================

document
    .getElementById("landRecord")
    .addEventListener(
        "change",
        function () {

            const option =
                this.options[
                    this.selectedIndex
                ];


            const details =
                document.getElementById(
                    "currentOwner"
                );


            if (!this.value) {

                details.style.display =
                    "none";

                return;

            }


            details.innerHTML = `

                <strong>
                    Current Owner
                </strong>

                <br><br>

                Name:
                ${option.dataset.owner}

                <br>

                Owner ID:
                ${option.dataset.ownerId}

            `;


            details.style.display =
                "block";

        }
    );



// ==========================================
// TRANSFER OWNERSHIP
// ==========================================

async function transferOwnership() {

    const recordId =
        document.getElementById(
            "landRecord"
        ).value;


    const newOwnerName =
        document.getElementById(
            "newOwnerName"
        ).value.trim();


    const newOwnerId =
        document.getElementById(
            "newOwnerId"
        ).value.trim();


    if (!recordId) {

        showMessage(
            "Please select a land record",
            false
        );

        return;

    }


    if (!newOwnerName || !newOwnerId) {

        showMessage(
            "Please enter the new owner's name and ID",
            false
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/${recordId}/transfer`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        newOwnerName:
                            newOwnerName,

                        newOwnerId:
                            newOwnerId

                    })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            showMessage(
                result.message ||
                "Transfer failed",
                false
            );

            return;

        }


        showMessage(
            "✅ Land ownership transferred successfully!",
            true
        );


        // Clear inputs

        document.getElementById(
            "newOwnerName"
        ).value = "";


        document.getElementById(
            "newOwnerId"
        ).value = "";


        // Reload records

        await loadLandRecords();


        document.getElementById(
            "landRecord"
        ).value = "";


        document.getElementById(
            "currentOwner"
        ).style.display = "none";


        // Show blockchain information

        if (result.blockchain) {

            console.log(
                "Blockchain Block:",
                result.blockchain
            );

        }

    } catch (error) {

        showMessage(
            "Unable to connect to server",
            false
        );

    }

}



// ==========================================
// MESSAGE
// ==========================================

function showMessage(
    text,
    success
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        success
            ? "message success"
            : "message error";


    message.style.display =
        "block";

}



// ==========================================
// START
// ==========================================

loadLandRecords();


</script>


</body>

</html>
