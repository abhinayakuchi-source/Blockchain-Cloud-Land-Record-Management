<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Land Records</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            padding: 6px 10px;
            border-radius: 5px;
            background: #dcfce7;
            color: #166534;
        }

        .verify {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .verify:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

        }

    </style>

</head>


<body>


<div class="navbar">

    <h2>
        🏡 Land Record Management
    </h2>

    <button
        class="back"
        onclick="goBack()">

        ← Dashboard

    </button>

</div>



<div class="container">

    <div class="card">

        <h1>
            📋 Land Records
        </h1>

        <p>
            All registered land records
            stored in the cloud database.
        </p>


        <div
            id="message"
            class="message">
        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Owner
                        </th>

                        <th>
                            Owner ID
                        </th>

                        <th>
                            Survey Number
                        </th>

                        <th>
                            Location
                        </th>

                        <th>
                            Area
                        </th>

                        <th>
                            Land Type
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="recordsTable">

                </tbody>

            </table>

        </div>

    </div>

</div>



<script>


const API_URL =
    "http://localhost:5000/api/land-records";


// ==========================================
// CHECK LOGIN
// ==========================================

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "login.html";

}



// ==========================================
// LOAD RECORDS
// ==========================================

async function loadRecords() {

    const table =
        document.getElementById(
            "recordsTable"
        );

    const message =
        document.getElementById(
            "message"
        );


    try {

        const response =
            await fetch(API_URL);


        const result =
            await response.json();


        if (
            !result.success ||
            !Array.isArray(result.data)
        ) {

            throw new Error(
                "Unable to load records."
            );

        }


        table.innerHTML = "";


        if (result.data.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center">

                        No land records found.

                    </td>

                </tr>

            `;

            return;

        }


        result.data.forEach(
            record => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${record.ownerName || "-"}
                    </td>

                    <td>
                        ${record.ownerId || "-"}
                    </td>

                    <td>
                        ${record.surveyNumber || "-"}
                    </td>

                    <td>
                        ${record.location || "-"}
                    </td>

                    <td>
                        ${record.landArea ?? "-"}
                    </td>

                    <td>
                        ${record.landType || "-"}
                    </td>

                    <td>

                        <span class="status">

                            ${
                                record.ownershipStatus
                                || "Active"
                            }

                        </span>

                    </td>

                    <td>

                        <button
                            class="verify"
                            onclick="verifyRecord(
                                '${record.surveyNumber}'
                            )">

                            Verify

                        </button>

                    </td>

                `;


                table.appendChild(row);

            }
        );


    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to the server.";

        message.className =
            "message error";

        message.style.display =
            "block";

    }

}



// ==========================================
// VERIFY RECORD
// ==========================================

function verifyRecord(
    surveyNumber
) {

    window.location.href =
        "verify-land.html?survey=" +
        encodeURIComponent(
            surveyNumber
        );

}



// ==========================================
// BACK TO DASHBOARD
// ==========================================

function goBack() {

    window.location.href =
        "dashboard.html";

}



// ==========================================
// START
// ==========================================

loadRecords();


</script>


</body>

</html>
